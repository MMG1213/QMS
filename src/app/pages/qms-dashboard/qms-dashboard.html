<header class="topbar">
  <!-- Replace this path with your actual Fujitec logo path -->
  <a class="brand" href="#" aria-label="Fujitec QMS Home">
    <img
      class="brand-logo"
      src="/assets/fujitec-logo.png"
      alt="Fujitec Quality Management System"
    />
  </a>

  <nav class="navigation" aria-label="QMS Modules">
    @for (tab of tabs; track tab) {
      <button
        type="button"
        class="nav-tab"
        [class.active]="activeTab === tab"
        [attr.aria-current]="activeTab === tab ? 'page' : null"
        (click)="selectTab(tab)"
      >
        {{ tab }}
      </button>
    }
  </nav>

  <div class="profile-container">
    <button
      type="button"
      class="profile-trigger"
      aria-label="Open user profile menu"
      [attr.aria-expanded]="profileMenuOpen"
      (click)="toggleProfileMenu()"
    >
      <span class="avatar">{{ userInitial }}</span>
      <svg
        class="chevron"
        [class.rotated]="profileMenuOpen"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m7 10 5 5 5-5" />
      </svg>
    </button>

    @if (profileMenuOpen) {
      <div class="profile-menu">
        <div class="profile-info">
          <span class="profile-name">{{ userName }}</span>
          <span class="profile-role">{{ userRole }}</span>
        </div>

        <div class="menu-divider"></div>

        <button type="button" class="menu-item" (click)="openProfile()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
          My Profile
        </button>

        <button type="button" class="menu-item logout" (click)="logout()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 17l5-5-5-5" />
            <path d="M15 12H3" />
            <path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7" />
          </svg>
          Logout
        </button>
      </div>
    }
  </div>
</header>

<main class="page-content" (click)="closeProfileMenu()">
  <section class="coming-soon" aria-live="polite">
    <div class="icon-wrapper">
      <svg
        class="document-icon"
        viewBox="0 0 88 88"
        fill="none"
        aria-hidden="true"
      >
        <rect x="19" y="11" width="44" height="58" rx="5" />
        <path d="M29 26h24M29 37h24M29 48h16" />
        <circle cx="61" cy="61" r="15" fill="#fffafa" />
        <path d="M61 52v10l7 4" />
      </svg>
      <span class="decoration-dot dot-one"></span>
      <span class="decoration-dot dot-two"></span>
    </div>

    <div class="accent-line"></div>

    <p class="eyebrow">FUJITEC QUALITY MANAGEMENT SYSTEM</p>

    <h1>Coming Soon</h1>

    <p class="description">
      The <strong>{{ activeTab }}</strong> module is currently under development.
    </p>

    <p class="supporting-text">
      We're working to bring you a streamlined quality management experience.
    </p>
  </section>
</main>
